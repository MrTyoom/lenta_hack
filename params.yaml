is_test: true

main_extraction:
  input_folder: "data/25_12-20"
  output_folder: "data/extracted_crops"
  model_path: "MAIN_MODULE/models/best.pt"
  min_crop_width: 50
  min_crop_height: 50
  sharpness_threshold: 50.0
  top_k: 1
  conf_threshold: 0.25
  iou_threshold: 0.45
  rotate_frames: True
  tracker_config: "bytetrack.yaml"

department_classifier: #Определение отдела
  model_path: "DEPARTMENT_CLASSIFICATION/train_model/models/best_model.pth"

quality_classifier:
  model_path: "CROP_QUALITY_CLASSIFICATION/quality_classifier/models/best_model.pth"
  input_folder: "data/final_result"

top_k_crops:
  input_folder: "data/extracted_crops"
  output_folder: "data/final_result"

ocr:
  input_folder: "data/final_result"
  cpu_threads: 12 # os.cpu_coint()
  text_recognition_batch_size: 32
